<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Areg Console — Superuser</title>
<link rel="icon" href="data:," /><!-- suppress the browser's /favicon.ico 404 -->

<style>
  :root { --bg:#0f1419; --panel:#1a2129; --line:#2a3441; --fg:#e6edf3; --mut:#8b98a5;
          --acc:#4ea1ff; --warn:#ffb454; --bad:#ff6b6b; --ok:#5bd68a; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { background:var(--panel); border-bottom:1px solid var(--line); padding:12px 18px;
           display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; margin-right:auto; font-weight:600; }
  header h1 small { color:var(--mut); font-weight:400; }
  input[type=password],input[type=text]{ background:#0c1116; border:1px solid var(--line); color:var(--fg);
           border-radius:6px; padding:7px 10px; min-width:230px; }
  button { background:var(--acc); color:#04111f; border:0; border-radius:6px; padding:7px 14px;
           font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); font-weight:400; }
  button:disabled { opacity:.5; cursor:default; }
  nav { display:flex; gap:4px; padding:10px 18px 0; flex-wrap:wrap; }
  nav a { padding:8px 14px; border-radius:8px 8px 0 0; color:var(--mut); cursor:pointer; user-select:none; }
  nav a.active { background:var(--panel); color:var(--fg); }
  main { padding:18px; }
  .msg { padding:10px 14px; border-radius:8px; margin:8px 0; }
  .msg.err { background:#3a1c1c; color:#ffc9c9; border:1px solid #5a2a2a; }
  .msg.info { background:#13202b; color:var(--mut); border:1px solid var(--line); }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card .n { font-size:24px; font-weight:700; }
  .card .l { color:var(--mut); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border-radius:10px; overflow:hidden; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
  tr:last-child td { border-bottom:0; }
  tr.click { cursor:pointer; }
  tr.click:hover td { background:#141c24; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; }
  .pill.on { background:#173a26; color:var(--ok); } .pill.off { background:#3a1c1c; color:var(--bad); }
  .pill.flag { background:#3a2c12; color:var(--warn); } .pill.blk { background:#3a1c1c; color:var(--bad); }
  .mut { color:var(--mut); } .mono { font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  code { background:#0c1116; padding:1px 5px; border-radius:4px; }
  .hide { display:none; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
</style>
</head>
<body>
<header>
  <h1>Areg Console <small>— superuser</small></h1>
  <span id="who" class="pill flag hide" title="resolved console operator"></span>
  <input id="token" type="password" placeholder="Admin token" autocomplete="off" />
  <input id="totp" type="text" placeholder="2FA code (if set)" inputmode="numeric" autocomplete="off" style="min-width:120px" />
  <button id="connect">Connect</button>
  <button id="disconnect" class="ghost hide">Disconnect</button>
</header>
<nav id="nav" class="hide">
  <a data-tab="overview" class="active">Overview</a>
  <a data-tab="devices">Devices</a>
  <a data-tab="parents">Parents</a>
  <a data-tab="stories">Stories</a>
  <a data-tab="flagged">Flagged</a>
  <a data-tab="conversations">Conversations</a>
  <a data-tab="requests">Requests</a>
  <a data-tab="audit">Audit</a>
  <a data-tab="tuning">Tuning</a>
</nav>
<main id="main">
  <div class="msg info">Enter the admin token and press Connect. The console is read-only.</div>
</main>

<script>
const $ = s => document.querySelector(s);
const main = $('#main'), nav = $('#nav');
let TOKEN = sessionStorage.getItem('aregAdminToken') || '';

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function err(m){ main.innerHTML = `<div class="msg err">${esc(m)}</div>`; }
function info(m){ main.innerHTML = `<div class="msg info">${esc(m)}</div>`; }
function dt(s){ return s ? new Date(s).toLocaleString() : '—'; }
function onoff(b){ return b ? '<span class="pill on">on</span>' : '<span class="pill off">off</span>'; }
function tri(v){ return v===null||v===undefined ? '<span class="mut">inherit</span>' : onoff(v); }

async function api(path){
  // no-store: always hit the server, never a cached copy — the console must
  // reflect live DB state, not a stale snapshot the browser held onto.
  const r = await fetch('/api/internal'+path, {
    cache:'no-store',
    headers: { 'Authorization': 'Bearer '+TOKEN }
  });
  if (r.status === 404) throw new Error('404 — invalid token, or the console is not enabled (set Internal:AdminToken on the backend).');
  if (!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

async function apiPost(path, body){
  const r = await fetch('/api/internal'+path, {
    method:'POST',
    cache:'no-store',
    headers:{ 'Authorization':'Bearer '+TOKEN, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  if (r.status === 404) throw new Error('404 — invalid token, or the console is not enabled.');
  if (!r.ok){ let m='HTTP '+r.status; try{ const j=await r.json(); if(j && j.error) m=j.error; }catch{} throw new Error(m); }
  return r.json();
}

function table(cols, rows, rowAttrs){
  let h = '<table><thead><tr>'+cols.map(c=>`<th>${c.h}</th>`).join('')+'</tr></thead><tbody>';
  if (!rows.length) h += `<tr><td colspan="${cols.length}" class="mut">Nothing here.</td></tr>`;
  rows.forEach((r,i)=>{
    h += `<tr ${rowAttrs?rowAttrs(r,i):''}>`+cols.map(c=>`<td>${c.f(r)}</td>`).join('')+'</tr>';
  });
  return h+'</tbody></table>';
}

// ---- support-lookup + triage helpers (client-side, read-only) ----
// Caches of the last-loaded lists so search/drill don't re-hit the server on
// every keystroke. Re-fetched each time the tab is opened (no-store).
let _devices = [], _parents = [], _flagged = [], _audit = [];
let _refreshTimer = null;
function matchq(q, parts){
  if(!q) return true; const s=q.toLowerCase();
  return parts.some(p => (p==null?'':String(p)).toLowerCase().includes(s));
}
function searchBar(id, ph){
  return `<div class="row"><input id="${id}" type="text" placeholder="${esc(ph)}" style="min-width:320px" autocomplete="off">`
    + `<span id="${id}_c" class="mut"></span></div>`;
}

const tabs = {
  async overview(){
    clearInterval(_refreshTimer); // avoid stacking timers across re-renders
    const o = await api('/overview');
    const card = (l,n,cls)=>`<div class="card"><div class="n"${cls?` style="color:var(--${cls})"`:''}>${esc(n)}</div><div class="l">${esc(l)}</div></div>`;
    main.innerHTML = `<div class="cards">`
      + card('Devices',o.devices)
      + card('Parents',o.parents)
      + card('Children',o.children)
      + card('Conversations',o.conversations)
      + card('Messages',o.messages)
      + card('Flagged total',o.flaggedMessages, o.flaggedMessages>0?'warn':null)
      + card('Msgs today',o.messagesToday)
      + card('Flagged today',o.flaggedToday, o.flaggedToday>0?'warn':null)
      + card('Paused devices',o.pausedDevices)
      + card('Cost today (USD)','$'+(o.costTodayUsd||0).toFixed(4), (o.costTodayUsd||0)>1?'warn':null)
      + card('Database', o.databaseReachable?'OK':'DOWN', o.databaseReachable?'ok':'bad')
      + `</div>`
      + `<p class="mut">Updated ${dt(o.generatedAtUtc)} · live (auto-refresh 20s) · cost is in-process (resets on backend restart). `
      + `<a class="mono" style="cursor:pointer;color:var(--acc)" onclick="show('overview')">refresh now</a></p>`;
    // Live ops view: keep the overview current while it's the active tab.
    _refreshTimer = setInterval(()=>{ if(current==='overview') tabs.overview().catch(()=>{}); }, 20000);
  },
  async devices(){
    _devices = (await api('/devices')).devices;
    main.innerHTML = `<div class="row mut">Search to find a toy; click a row to investigate its conversations.</div>`
      + searchBar('devQ','Search devices — name, MAC, id') + '<div id="devList"></div>';
    const cols = [
      {h:'Name',f:r=>esc(r.name)+`<div class="mono mut">${esc(r.macAddress)}</div>`},
      {h:'Status',f:r=> (r.isRevoked?'<span class="pill blk">revoked</span> ':'')
        + (r.isPaused?'<span class="pill blk">paused</span>':'<span class="pill on">active</span>')},
      {h:'Last seen',f:r=>dt(r.lastSeenAt)},
      {h:'Bedtime',f:r=>r.bedtimeStart?`${esc(r.bedtimeStart)}–${esc(r.bedtimeEnd)}`:'<span class="mut">—</span>'},
      {h:'Modes (S/G/R/C)',f:r=>[r.storyEnabled,r.gameEnabled,r.riddleEnabled,r.curiosityEnabled].map(onoff).join(' ')},
      {h:'Parents',f:r=>r.linkedParents},
      {h:'Children',f:r=>r.childrenList.length?r.childrenList.map(c=>esc(c.name)+(c.age!=null?` (${c.age})`:'')).join(', '):'<span class="mut">—</span>'},
      {h:'Cost today',f:r=>'$'+(r.costTodayUsd||0).toFixed(4)},
    ];
    const draw = q => {
      const rows = _devices.filter(d=>matchq(q,[d.name,d.macAddress,d.id]));
      $('#devQ_c').textContent = `${rows.length} of ${_devices.length}`;
      $('#devList').innerHTML = table(cols, rows, r=>`class="click" onclick="openDevice('${r.id}')"`);
    };
    $('#devQ').addEventListener('input', e=>draw(e.target.value));
    draw('');
  },
  async parents(){
    _parents = (await api('/parents')).parents;
    main.innerHTML = `<div class="row mut">Search for a parent account (support lookup).</div>`
      + searchBar('parQ','Search parents — email, id') + '<div id="parList"></div>';
    const cols = [
      {h:'Email',f:r=>esc(r.email)},
      {h:'Verified',f:r=>r.emailVerifiedAt?'<span class="pill on">yes</span>':'<span class="pill off">no</span>'},
      {h:'Google',f:r=>r.googleLinked?'<span class="pill on">linked</span>':'<span class="mut">—</span>'},
      {h:'Last login',f:r=>dt(r.lastLoginAt)},
      {h:'Registered',f:r=>dt(r.registeredAt)},
      {h:'Devices',f:r=>r.linkedDevices},
      {h:'Audit',f:r=>r.auditEvents},
      {h:'Anonymized',f:r=>r.anonymizedAt?'<span class="pill blk">yes</span>':'<span class="mut">—</span>'},
    ];
    const draw = q => {
      const rows = _parents.filter(p=>matchq(q,[p.email,p.id]));
      $('#parQ_c').textContent = `${rows.length} of ${_parents.length}`;
      $('#parList').innerHTML = table(cols, rows);
    };
    $('#parQ').addEventListener('input', e=>draw(e.target.value));
    draw('');
  },
  async stories(){
    const s = (await api('/stories')).stories;
    const active = s.filter(x=>x.isDefault).length;
    main.innerHTML = `<div class="msg info">${active} active story (served on the device) · ${s.length} in the library
      (the rest are built-in sample stories).</div>` + table([
      {h:'',f:r=>r.isDefault?'<span class="pill on">default</span>':'<span class="mut">sample</span>'},
      {h:'Id',f:r=>`<span class="mono">${esc(r.id)}</span>`},
      {h:'Title',f:r=>esc(r.title)},
      {h:'Ages',f:r=>`${r.minAge}–${r.maxAge}`},
      {h:'Tone',f:r=>esc(r.tone)},
      {h:'Segments',f:r=>r.segments},
      {h:'Bedtime-safe',f:r=>onoff(r.bedtimeSafe)},
      {h:'Conclusion',f:r=>onoff(r.hasReflectionText)},
      {h:'Questions',f:r=>r.reflectionQuestions},
    ], s);
  },
  async requests(){
    // Slice F — the owner's custom-story-request queue. Read + reversible
    // status moves (reason required, audited). Photos stream operator-only.
    const rs = (await api('/story-requests')).requests;
    const pill = s => ({'new':'flag','in_review':'info','delivered':'on','declined':'blk'}[s]||'off');
    main.innerHTML = `<div class="row mut">Custom-story requests from parents — work them top-down; move the status as you go.</div>`
      + table([
        {h:'When',f:r=>dt(r.createdAtUtc)},
        {h:'From',f:r=>r.parentEmail?esc(r.parentEmail):'<span class="mut">account gone</span>'},
        {h:'Type',f:r=>esc(r.type)},
        {h:'Request',f:r=>esc(r.text||'(photo only)')
          + (r.hasPhoto?` <a class="mono" style="color:var(--acc);cursor:pointer" onclick="openRequestPhoto('${r.id}')">📷 photo</a>`:'')},
        {h:'Status',f:r=>`<span class="pill ${pill(r.status)}">${esc(r.status)}</span>`},
        {h:'Move to',f:r=>['in_review','delivered','declined']
          .filter(s=>s!==r.status)
          .map(s=>`<button class="ghost" onclick="setRequestStatus('${r.id}','${s}')">${s}</button>`)
          .join(' ')},
      ], rs);
  },
  async flagged(){
    _flagged = (await api('/flagged?limit=100')).messages;
    // Prioritized triage: Blocked outranks other non-clean flags, then newest
    // first — a credible block should never sit below older soft flags.
    _flagged.sort((a,b)=>{
      const pa=a.safetyFlag==='Blocked'?0:1, pb=b.safetyFlag==='Blocked'?0:1;
      if(pa!==pb) return pa-pb;
      return new Date(b.timestamp)-new Date(a.timestamp);
    });
    const nBlk = _flagged.filter(m=>m.safetyFlag==='Blocked').length;
    const nFlag = _flagged.length - nBlk;
    main.innerHTML = `<div class="row">
        <button class="ghost" id="fAll">All (${_flagged.length})</button>
        <button class="ghost" id="fBlk">Blocked (${nBlk})</button>
        <button class="ghost" id="fFlag">Flagged (${nFlag})</button>
        <span class="mut">click a row to open the full conversation in context</span>
      </div><div id="flagList"></div>`;
    const cols = [
      {h:'When',f:r=>dt(r.timestamp)},
      {h:'Flag',f:r=>`<span class="pill ${r.safetyFlag==='Blocked'?'blk':'flag'}">${esc(r.safetyFlag)}</span>`},
      {h:'Role',f:r=>esc(r.role)},
      {h:'Snippet',f:r=>esc(r.snippet)},
      {h:'Device',f:r=>`<span class="mono mut">${esc(r.deviceId.slice(0,8))}</span>`},
    ];
    const draw = mode => {
      const rows = _flagged.filter(m=> mode==='all' || (mode==='blk'?m.safetyFlag==='Blocked':m.safetyFlag!=='Blocked'));
      $('#flagList').innerHTML = rows.length
        ? table(cols, rows, r=>`class="click" onclick="openConv('${r.conversationId}')"`)
        : `<div class="msg info">✓ Nothing here — no ${mode==='blk'?'blocked':mode==='flag'?'flagged':'flagged or blocked'} messages.</div>`;
    };
    $('#fAll').addEventListener('click', ()=>draw('all'));
    $('#fBlk').addEventListener('click', ()=>draw('blk'));
    $('#fFlag').addEventListener('click', ()=>draw('flag'));
    draw('all');
  },
  async conversations(){
    const c = (await api('/conversations?limit=100')).conversations;
    main.innerHTML = `<div class="row mut">Click a conversation to see its messages.</div>` + table([
      {h:'Started',f:r=>dt(r.startedAt)},
      {h:'Device',f:r=>`<span class="mono mut">${esc(r.deviceId.slice(0,8))}</span>`},
      {h:'Msgs',f:r=>r.messageCount},
      {h:'Flagged',f:r=>r.flaggedCount?`<span class="pill flag">${r.flaggedCount}</span>`:'<span class="mut">0</span>'},
      {h:'Snippet',f:r=>esc(r.snippet)},
    ], c, r=>`class="click" onclick="openConv('${r.id}')"`);
  },
  async audit(){
    _audit = (await api('/audit?limit=100')).events;
    const nAct = _audit.filter(x=>x.eventType==='InternalConsoleAction').length;
    main.innerHTML = `<div class="row">
        <button class="ghost" id="aAll">All (${_audit.length})</button>
        <button class="ghost" id="aAct">Operator actions (${nAct})</button>
        <button class="ghost" id="aAcc">Console access</button>
        <button class="ghost" id="aSys">System / other</button>
        <span class="mut">operator actions are highlighted — the accountability record</span>
      </div><div id="audList"></div>`;
    const actorCell = r => {
      if (r.actorParentId) return `<span class="mono mut">${esc(r.actorParentId.slice(0,8))}</span>`;
      const op = r.metadata && r.metadata.operator;
      return op ? `<span class="pill flag">${esc(op)}</span>` : '<span class="pill flag">system</span>';
    };
    const detailCell = r => {
      const m = r.metadata;
      if (!m) return '<span class="mut">—</span>';
      if (r.eventType==='InternalConsoleAction')
        return `<b>${esc(m.action)}</b> = ${esc(String(m.value))} <span class="mut">·</span> ${esc(m.reason||'')}`;
      return `<code class="mono">${esc(JSON.stringify(m))}</code>`;
    };
    const cols = [
      {h:'When',f:r=>dt(r.timestamp)},
      {h:'Event',f:r=>esc(r.eventType)},
      {h:'Actor',f:actorCell},
      {h:'Target',f:r=>r.targetDeviceId?`<span class="mono mut">${esc(r.targetDeviceId.slice(0,8))}</span>`:'<span class="mut">—</span>'},
      {h:'Detail',f:detailCell},
    ];
    const draw = mode => {
      const rows = _audit.filter(r =>
        mode==='all' ? true :
        mode==='act' ? r.eventType==='InternalConsoleAction' :
        mode==='acc' ? r.eventType==='InternalConsoleAccess' :
        (r.eventType!=='InternalConsoleAction' && r.eventType!=='InternalConsoleAccess'));
      $('#audList').innerHTML = table(cols, rows,
        r => r.eventType==='InternalConsoleAction' ? 'style="background:#2a1f12"' : '');
    };
    $('#aAll').onclick=()=>draw('all'); $('#aAct').onclick=()=>draw('act');
    $('#aAcc').onclick=()=>draw('acc'); $('#aSys').onclick=()=>draw('sys');
    draw('all');
  },
  async tuning(){
    const s = (await api('/stories')).stories;
    const opts = s.map(x=>`<option value="${esc(x.id)}">${esc(x.title)} — ${esc(x.id)} (${x.segments} seg)</option>`).join('');
    main.innerHTML = `
      <div class="msg info">Type a child's question and see Areg's <b>bounded</b> answer through the real pipeline
        (input moderation → GPT → answer filter → repair → fallback → output moderation). Text only — no TTS, nothing saved.
        <b>Calls OpenAI (costs credits).</b></div>
      <div class="row">
        <select id="tStory">${opts}</select>
        <label class="mut">segment <input id="tSeg" type="text" value="0" style="width:60px"></label>
        <button id="tAsk">Ask Areg</button>
      </div>
      <textarea id="tQ" placeholder="Type a child question in Armenian, e.g. «Ի՞նչ գտավ Հուռին գետում»…"
        style="width:100%;min-height:70px;background:#0c1116;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:8px;font:inherit"></textarea>
      <div id="tOut"></div>`;
    $('#tAsk').addEventListener('click', askTuning);
    $('#tQ').addEventListener('keydown', ev=>{ if(ev.key==='Enter' && (ev.ctrlKey||ev.metaKey)) askTuning(); });
  },
};

async function askTuning(){
  const btn=$('#tAsk'), out=$('#tOut');
  const body={ storyId:$('#tStory').value, segmentIndex:parseInt($('#tSeg').value||'0',10)||0, question:$('#tQ').value };
  if(!body.question.trim()){ out.innerHTML='<div class="msg err">Type a question first.</div>'; return; }
  btn.disabled=true; out.innerHTML='<div class="msg info">Asking Areg… (calling OpenAI)</div>';
  try{
    const r=await apiPost('/story-qa-test', body);
    const cls = r.outcome==='answered' ? 'on' : ((r.outcome==='input_blocked'||r.outcome==='output_blocked') ? 'blk' : 'flag');
    out.innerHTML=`
      <div class="card" style="margin-top:12px">
        <div class="l">Areg's answer</div>
        <div style="font-size:18px;margin:8px 0">${esc(r.answer)}</div>
        <div class="mut">outcome <span class="pill ${cls}">${esc(r.outcome)}</span>
          · usedFallback <b>${r.usedFallback}</b>
          · input ${r.inputSafe?'safe':'<b>BLOCKED</b>'} · output ${r.outputSafe?'safe':'<b>BLOCKED</b>'}
          · firstRejection <code>${esc(r.firstRejection)}</code>${r.retryRejection?` · retry <code>${esc(r.retryRejection)}</code>`:''}</div>
      </div>
      <div class="card" style="margin-top:10px">
        <div class="l">Segment ${r.segmentIndex} — what the child just heard</div>
        <div class="mut" style="margin-top:6px;white-space:pre-wrap">${esc(r.segmentText)}</div>
      </div>`;
  }catch(e){ out.innerHTML=`<div class="msg err">${esc(e.message)}</div>`; }
  finally{ btn.disabled=false; }
}

window.openDevice = async function(id){
  const d = _devices.find(x=>x.id===id);
  info('Loading device…');
  try {
    const convs = (await api('/conversations?deviceId='+encodeURIComponent(id)+'&limit=100')).conversations;
    const head = d ? `<div class="cards" style="margin-bottom:12px">
        <div class="card"><div class="n" style="color:var(--${d.isRevoked||d.isPaused?'warn':'ok'})">${d.isRevoked?'Revoked':d.isPaused?'Paused':'Active'}</div><div class="l">status</div></div>
        <div class="card"><div class="n" style="font-size:15px">${esc(dt(d.lastSeenAt))}</div><div class="l">last seen</div></div>
        <div class="card"><div class="n">$${(d.costTodayUsd||0).toFixed(4)}</div><div class="l">cost today</div></div>
        <div class="card"><div class="n">${d.linkedParents}</div><div class="l">parents</div></div>
      </div>` : '';
    const revokeDanger = d && !d.isRevoked ? 'style="background:var(--bad);color:#fff"' : '';
    const actions = d ? `<div class="row">
        <button ${revokeDanger} onclick="opAction('revoke','${id}',${!d.isRevoked})">${d.isRevoked?'Restore access':'Revoke (kill switch)'}</button>
        <button class="ghost" onclick="opAction('pause','${id}',${!d.isPaused})">${d.isPaused?'Resume':'Pause'}</button>
        <span class="mut">operator action — a reason is required and audit-logged</span>
      </div>` : '';
    main.innerHTML = `<div class="row"><button class="ghost" onclick="show('devices')">← devices</button>
        <span class="mut">${d?esc(d.name):''} <span class="mono">${esc(id.slice(0,8))}</span>${d?' · '+esc(d.macAddress):''}</span></div>`
      + head
      + actions
      + `<div class="row mut">Conversations on this device — click to open in context.</div>`
      + table([
        {h:'Started',f:r=>dt(r.startedAt)},
        {h:'Msgs',f:r=>r.messageCount},
        {h:'Flagged',f:r=>r.flaggedCount?`<span class="pill flag">${r.flaggedCount}</span>`:'<span class="mut">0</span>'},
        {h:'Snippet',f:r=>esc(r.snippet)},
      ], convs, r=>`class="click" onclick="openConv('${r.id}')"`);
  } catch(e){ err(e.message); }
};

// Phase 3 — reversible operator action (revoke/restore, pause/resume).
// Requires a typed reason (sent to the audit log) and a confirm for revoke.
window.opAction = async function(kind, id, value){
  const label = kind==='revoke'
    ? (value ? 'REVOKE this toy (it stops working until re-provisioned)' : 'restore access')
    : (value ? 'pause this toy' : 'resume this toy');
  const reason = prompt('Reason to '+label+'\n(required — recorded in the audit log):', '');
  if (reason === null) return;                 // cancelled
  if (!reason.trim()){ alert('A reason is required.'); return; }
  if (kind==='revoke' && value &&
      !confirm('Revoke kills the toy’s login everywhere until it re-provisions. Continue?')) return;
  try {
    await apiPost('/devices/'+id+'/'+kind, { value: value, reason: reason.trim() });
    _devices = (await api('/devices')).devices; // refresh cached flags
    openDevice(id);                             // re-render with the new state
  } catch(e){ err(e.message); }
};

window.setRequestStatus = async function(id, status){
  const reason = prompt('Reason for moving this request to "'+status+'":');
  if (reason === null) return;
  if (!reason.trim()) { alert('A reason is required.'); return; }
  try {
    await apiPost('/story-requests/'+id+'/status', { status: status, reason: reason.trim() });
    show('requests');
  } catch(e){ err(e.message); }
};

window.openRequestPhoto = async function(id){
  // Operator-only stream; fetched with the token and opened as a blob so
  // the photo never needs a public URL.
  try {
    const r = await fetch('/api/internal/story-requests/'+id+'/photo', {
      cache:'no-store', headers:{ 'Authorization':'Bearer '+TOKEN }
    });
    if (!r.ok) throw new Error('Photo not available.');
    const blob = await r.blob();
    window.open(URL.createObjectURL(blob), '_blank');
  } catch(e){ err(e.message); }
};

window.openConv = async function(id){
  try {
    const c = await api('/conversations/'+id);
    main.innerHTML = `<div class="row"><button class="ghost" onclick="show('conversations')">← back</button>
      <span class="mut">conversation <span class="mono">${esc(id.slice(0,8))}</span> · device <span class="mono">${esc(c.deviceId.slice(0,8))}</span> · ${dt(c.startedAt)}</span></div>` + table([
      {h:'When',f:m=>dt(m.timestamp)},
      {h:'Role',f:m=>esc(m.role)},
      {h:'Flag',f:m=>m.safetyFlag==='Clean'?'<span class="mut">clean</span>':`<span class="pill ${m.safetyFlag==='Blocked'?'blk':'flag'}">${esc(m.safetyFlag)}</span>`},
      {h:'Content',f:m=>esc(m.content)},
      {h:'Audio',f:m=>m.audioAvailable?'<span class="pill on">▶</span>':'<span class="mut">—</span>'},
    ], c.messages);
  } catch(e){ err(e.message); }
};

let current = 'overview';
window.show = async function(tab){
  clearInterval(_refreshTimer); // stop overview auto-refresh when leaving it
  current = tab;
  [...nav.children].forEach(a=>a.classList.toggle('active', a.dataset.tab===tab));
  info('Loading…');
  try { await tabs[tab](); }
  catch(e){
    // A 404 while signed in almost always means the time-boxed session expired
    // (or access was revoked) — drop cleanly back to sign-in.
    if (TOKEN && String(e.message||'').startsWith('404')){
      TOKEN=''; sessionStorage.removeItem('aregAdminToken');
      setConnected(false); info('Session expired — sign in again.');
    } else err(e.message);
  }
};

nav.addEventListener('click', e=>{ if(e.target.dataset.tab) show(e.target.dataset.tab); });

async function showWho(){
  try { const w = await api('/whoami'); $('#who').textContent = 'operator: '+w.operator; $('#who').classList.remove('hide'); }
  catch { $('#who').classList.add('hide'); }
}
function setConnected(on){
  nav.classList.toggle('hide', !on);
  $('#disconnect').classList.toggle('hide', !on);
  $('#connect').classList.toggle('hide', on);
  $('#token').classList.toggle('hide', on);
  $('#totp').classList.toggle('hide', on);
  $('#who').classList.toggle('hide', !on);
  if (on) showWho();
}

// Sign in = exchange the static admin token (+ a 2FA code if the operator has
// one) for a short-lived SESSION token via POST /session. Only the session
// token is kept (in sessionStorage) and used for every subsequent call — the
// static token is used once and never stored. Works whether or not the backend
// requires sessions (the endpoint always issues one).
$('#connect').addEventListener('click', async ()=>{
  const staticToken = $('#token').value.trim();
  const totp = $('#totp').value.trim();
  if (!staticToken){ err('Enter the admin token.'); return; }
  info('Signing in…');
  try {
    const r = await fetch('/api/internal/session', {
      method:'POST', cache:'no-store',
      headers:{ 'Authorization':'Bearer '+staticToken, 'Content-Type':'application/json' },
      body: JSON.stringify({ totp: totp || null })
    });
    if (r.status === 404) throw new Error('Invalid token, or the console is not enabled.');
    if (r.status === 401) throw new Error('Invalid 2FA code.');
    if (!r.ok) throw new Error('Sign-in failed (HTTP '+r.status+').');
    const j = await r.json();
    TOKEN = j.sessionToken;                          // session token, not the static one
    sessionStorage.setItem('aregAdminToken', TOKEN);
    $('#totp').value = '';
    setConnected(true);
    show('overview');
  } catch(e){ err(e.message); }
});
$('#disconnect').addEventListener('click', ()=>{
  TOKEN=''; sessionStorage.removeItem('aregAdminToken');
  setConnected(false); info('Signed out.');
});

// Auto-reconnect if a (still-valid) session token is in this browser session.
// An expired one will 404 on the first data call and drop back to sign-in.
if (TOKEN){ setConnected(true); show('overview'); }
</script>
