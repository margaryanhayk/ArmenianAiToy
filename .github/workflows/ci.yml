name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ArmenianAiToy.slnx

      - name: Build
        run: dotnet build ArmenianAiToy.slnx --no-restore -c Release

      - name: Test
        run: dotnet test ArmenianAiToy.slnx --no-build -c Release
