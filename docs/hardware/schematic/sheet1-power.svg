central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="478.79999999999995" dy="11">+3V3  (one rail: MCU, mic, SD, amp*)</tspan></text><text x="3.6" y="136.4" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="3.6" dy="11">* Amp on 3V3 requires speaker ≥88 dB/W/m (power-tree.md §4).</tspan><tspan x="3.6" dy="11">Rule: every chemistry crosses 3.3 V during discharge → buck-boost is mandatory;</tspan><tspan x="3.6" dy="11">a plain buck drops out below ~3.4 V in, an LDO (AMS1117, 1.1 V dropout) needs ≥4.4 V in.</tspan></text><circle cx="144" cy="-90" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="385.2" cy="-140.4" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="439.2" cy="-140.4" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /></svg>